<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotSync - Real-Time Parking Discovery, Reservation & Ticketing</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS for Interactive Map & Navigation -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- QRCode.js Library for Digital Tickets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

  <!-- TOP NAVIGATION BAR -->
  <header class="glass-nav sticky top-0 z-50 px-4 lg:px-8 py-3 flex items-center justify-between">
    <!-- Brand & Logo -->
    <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
        <i data-lucide="parking-square" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400 bg-clip-text text-transparent">SpotSync</span>
          <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">v1.1</span>
        </div>
        <p class="text-xs text-slate-400 font-medium hidden sm:block">Real-Time Parking Discovery & Ticketing</p>
      </div>
    </div>

    <!-- Active User & Role Switcher Pills -->
    <div class="flex items-center gap-2 bg-slate-900/90 p-1 rounded-full border border-slate-800">
      <button onclick="app.switchRole('driver')" id="role-btn-driver" class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 bg-blue-600 text-white shadow-md">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> Driver Mode
      </button>
      <button onclick="app.switchRole('lot_admin')" id="role-btn-lot_admin" class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Lot Admin
      </button>
      <button onclick="app.switchRole('sys_admin')" id="role-btn-sys_admin" class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white hidden md:flex">
        <i data-lucide="settings" class="w-3.5 h-3.5"></i> Sys Admin
      </button>
      <button onclick="app.switchRole('guest')" id="role-btn-guest" class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
        <i data-lucide="user-x" class="w-3.5 h-3.5"></i> Guest
      </button>
    </div>

    <!-- Right Actions: Nav links, Notifications Bell, Auth -->
    <div class="flex items-center gap-3">
      <!-- Nav Links -->
      <nav class="hidden lg:flex items-center gap-1">
        <button onclick="app.navigate('home')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Search</button>
        <button onclick="app.navigate('bookings')" id="nav-bookings-btn" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition">My Bookings</button>
        <button onclick="app.navigate('scanner')" id="nav-scanner-btn" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition hidden">Gate Scanner</button>
        <button onclick="app.navigate('admin')" id="nav-admin-btn" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition hidden">Admin Dashboard</button>
      </nav>

      <!-- Notifications Dropdown Bell -->
      <div class="relative">
        <button onclick="app.toggleNotificationsDropdown()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition relative">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span id="notif-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center animate-bounce">0</span>
        </button>

        <!-- Dropdown Card -->
        <div id="notif-dropdown" class="hidden absolute right-0 mt-3 w-80 sm:w-96 glass-panel rounded-2xl p-4 shadow-2xl z-50 border border-slate-700">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2">
              <i data-lucide="bell" class="w-4 h-4 text-blue-400"></i> Notifications
            </h4>
            <button onclick="app.markNotificationsRead()" class="text-xs text-blue-400 hover:underline">Mark all as read</button>
          </div>
          <div id="notif-list" class="mt-3 max-h-72 overflow-y-auto divide-y divide-slate-800/60 text-xs text-slate-300">
            <div class="py-4 text-center text-slate-500">No notifications yet.</div>
          </div>
        </div>
      </div>

      <!-- Auth Action Button / User Profile -->
      <div id="auth-container">
        <!-- Rendered dynamically by JS -->
      </div>
    </div>
  </header>

  <!-- LIVE REAL-TIME STATUS BANNER -->
  <div id="ws-banner" class="bg-emerald-950/80 border-b border-emerald-800/50 px-4 py-1.5 text-xs text-emerald-300 flex items-center justify-between font-medium">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span>WebSocket Connected: Real-time availability propagation active (&lt; 5s sync REQ-8)</span>
    </div>
    <span class="text-slate-400 text-[11px]" id="current-time-clock">10:49:35 AM</span>
  </div>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 space-y-6">
    <!-- Views rendered dynamically by app.js -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800/80 bg-slate-950 px-6 py-6 text-xs text-slate-500 text-center flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-[10px]">S</div>
      <span class="font-semibold text-slate-400">SpotSync SRS v1.1 Implementation</span>
      <span>• Sardar Patel Institute of Technology</span>
    </div>
    <div class="flex items-center gap-4 text-slate-400">
      <button onclick="app.showApiInfoModal()" class="hover:text-blue-400 transition flex items-center gap-1">
        <i data-lucide="key" class="w-3.5 h-3.5"></i> API Keys & Config Guide
      </button>
      <button onclick="app.navigate('profile')" class="hover:text-blue-400 transition">Profile & Preferences</button>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full pointer-events-none"></div>

  <!-- MODALS CONTAINER -->
  <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <!-- Rendered dynamically -->
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
