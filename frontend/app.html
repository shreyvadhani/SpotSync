<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotSync App — Find, Reserve & Enter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap">

  <!-- Tailwind CSS CDN, re-themed to the SpotSync landing palette:
       slate  -> neutral blacks, blue -> cyan #45CFFF (primary buttons are white, like the landing),
       emerald -> green #35D59A -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            slate: {
              50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4', 400: '#a3a3a3',
              500: '#8a8a8a', 600: '#3a3a3a', 700: '#2a2a2a', 800: '#1a1a1a', 900: '#0d0d0d', 950: '#000000'
            },
            blue: {
              50: '#eaf9ff', 100: '#cdf1ff', 200: '#a0e5ff', 300: '#6fd9ff', 400: '#45CFFF',
              500: '#45CFFF', 600: '#ffffff', 700: '#1a98c7', 800: '#0e6a8c', 900: '#0b3a4d', 950: '#061c26'
            },
            emerald: {
              300: '#7fe6bf', 400: '#35D59A', 500: '#35D59A', 600: '#35D59A', 700: '#1fa371',
              800: '#14694a', 900: '#0c3d2b', 950: '#05241a'
            },
            brand: { 500: '#45CFFF', 600: '#45CFFF' }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS for Interactive Map & Navigation -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- QRCode.js Library for Digital Tickets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- SpotSync theme (landing-page design language) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header class="glass-nav sticky top-0 z-50 px-4 lg:px-8 py-3 flex items-center justify-between gap-4">
    <!-- Brand & Logo -->
    <div class="flex items-center gap-4">
      <a href="index.html" class="brand-link flex items-center gap-2.5 text-white no-underline" aria-label="SpotSync landing page">
        <span class="relative block w-[26px] h-[30px]">
          <span class="absolute left-2 top-[9px] w-2.5 h-2.5 rounded-full bg-blue-400 opacity-50 ss-ping"></span>
          <svg width="26" height="30" viewBox="0 0 26 30" fill="none" class="absolute inset-0"><path d="M13 28S3 19.6 3 11.5a10 10 0 0 1 20 0C23 19.6 13 28 13 28Z" stroke="#45CFFF" stroke-width="1.75" stroke-linejoin="round"/><circle cx="13" cy="11.5" r="3.4" fill="#45CFFF"/></svg>
        </span>
        <span class="font-extrabold text-[22px] tracking-tighter leading-none text-white">Spot<span class="text-blue-400">Sync</span></span>
      </a>
      <span class="hidden sm:inline text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 border border-blue-400/40 text-blue-400">v1.1</span>
    </div>

    <!-- Active User & Role Switcher Pills -->
    <div class="flex items-center gap-1 bg-slate-900/90 p-1 border border-slate-800">
      <button onclick="app.switchRole('driver')" id="role-btn-driver" class="px-3 py-1.5 text-xs font-semibold transition-all flex items-center gap-1.5 bg-blue-600 text-white">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> Driver Mode
      </button>
      <button onclick="app.switchRole('lot_admin')" id="role-btn-lot_admin" class="px-3 py-1.5 text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Lot Admin
      </button>
      <button onclick="app.switchRole('sys_admin')" id="role-btn-sys_admin" class="px-3 py-1.5 text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white hidden md:flex">
        <i data-lucide="settings" class="w-3.5 h-3.5"></i> Sys Admin
      </button>
      <button onclick="app.switchRole('guest')" id="role-btn-guest" class="px-3 py-1.5 text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
        <i data-lucide="user-x" class="w-3.5 h-3.5"></i> Guest
      </button>
    </div>

    <!-- Right Actions: Nav links, Notifications Bell, Auth -->
    <div class="flex items-center gap-3">
      <nav class="hidden lg:flex items-center gap-1">
        <button onclick="app.navigate('home')" class="nav-link px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Search</button>
        <button onclick="app.navigate('bookings')" id="nav-bookings-btn" class="nav-link px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition">My Bookings</button>
        <button onclick="app.navigate('scanner')" id="nav-scanner-btn" class="nav-link px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition hidden">Gate Scanner</button>
        <button onclick="app.navigate('admin')" id="nav-admin-btn" class="nav-link px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition hidden">Admin Dashboard</button>
      </nav>

      <!-- Notifications Dropdown Bell -->
      <div class="relative">
        <button onclick="app.toggleNotificationsDropdown()" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition relative" aria-label="Notifications">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span id="notif-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center">0</span>
        </button>

        <div id="notif-dropdown" class="hidden absolute right-0 mt-3 w-80 sm:w-96 glass-panel p-4 z-50 border border-slate-700">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2">
              <i data-lucide="bell" class="w-4 h-4 text-blue-400"></i> Notifications
            </h4>
            <button onclick="app.markNotificationsRead()" class="text-xs text-blue-400 hover:underline">Mark all as read</button>
          </div>
          <div id="notif-list" class="mt-3 max-h-72 overflow-y-auto divide-y divide-slate-800/60 text-xs text-slate-300">
            <div class="py-4 text-center text-slate-500">No notifications yet.</div>
          </div>
        </div>
      </div>

      <!-- Auth Action Button / User Profile -->
      <div id="auth-container"></div>
    </div>
  </header>

  <!-- LIVE REAL-TIME STATUS BANNER -->
  <div id="ws-banner" class="ws-banner px-4 py-1.5 text-xs flex items-center justify-between font-medium">
    <div class="flex items-center gap-2">
      <span id="ws-dot" class="w-2 h-2 rounded-full bg-emerald-400 ss-ping"></span>
      <span id="ws-text" class="mono-label">Connecting to real-time availability stream…</span>
    </div>
    <span class="text-slate-400 text-[11px] mono-label" id="current-time-clock"></span>
  </div>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 space-y-6">
    <!-- Views rendered dynamically by app.js -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800/80 px-6 py-6 text-xs text-slate-500 text-center flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2 mono-label">
      <span class="font-semibold text-slate-400">SpotSync SRS v1.1</span>
      <span>• Sardar Patel Institute of Technology</span>
    </div>
    <div class="flex items-center gap-4 text-slate-400 mono-label">
      <a href="index.html" class="hover:text-blue-400 transition">Landing page</a>
      <a href="/docs" target="_blank" class="hover:text-blue-400 transition">API docs</a>
      <button onclick="app.showApiInfoModal()" class="hover:text-blue-400 transition flex items-center gap-1">
        <i data-lucide="key" class="w-3.5 h-3.5"></i> API Keys & Config Guide
      </button>
      <button onclick="app.navigate('profile')" class="hover:text-blue-400 transition">Profile & Preferences</button>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full pointer-events-none"></div>

  <!-- MODALS CONTAINER -->
  <div id="modal-container" class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
